name: Build FileBackupApp IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned app
        run: |
          xcodebuild build -project FileBackupApp/FileBackupApp.xcodeproj -scheme FileBackupApp -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FileBackupApp.app Payload/
          zip -r "FileBackupApp-1.0-Build(1).ipa" Payload
          rm -rf Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FileBackupApp-IPA
          path: "*.ipa"
